version: 0.2

env:
  variables:
    AWS_REGION: "ap-south-1"
    ECR_REPO: "964474461010.dkr.ecr.ap-south-1.amazonaws.com/microservices-backend"
    EKS_CLUSTER_NAME: "microservices-backend"
    NAMESPACE: "dev"

phases:
  install:
    commands:
      - echo "========== INSTALL PHASE =========="
      - set -e
      - echo "Installing kubectl..."
      - curl -s -o kubectl https://amazon-eks.s3.us-west-2.amazonaws.com/1.21.2/2021-07-05/bin/linux/amd64/kubectl
      - chmod +x kubectl
      - mv kubectl /usr/local/bin/
      - kubectl version --client
      - echo "✓ kubectl installed"

  pre_build:
    commands:
      - echo "========== PRE-BUILD PHASE =========="
      - set -e

      - echo "Logging into Docker Hub..."
      - echo "$DOCKERHUB_PASSWORD" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
      - echo "✓ Docker Hub login successful"

      - echo "Logging into Amazon ECR..."
      - aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $ECR_REPO
      - echo "✓ ECR login successful"

      - echo "Setting image variables..."
      - COMMIT_HASH=$(echo $CODEBUILD_RESOLVED_SOURCE_VERSION | cut -c 1-7)
      - IMAGE_TAG=${COMMIT_HASH:=latest}
      - echo "Image tag: $IMAGE_TAG"

      - echo "Checking IAM identity..."
      - aws sts get-caller-identity

      - echo "Updating kubeconfig..."
      - aws eks update-kubeconfig --region $AWS_REGION --name $EKS_CLUSTER_NAME

      - echo "Ensuring namespace exists..."
      - kubectl get namespace $NAMESPACE || kubectl create namespace $NAMESPACE

      - echo "Testing cluster connectivity..."
      - kubectl get nodes
      - echo "✓ Cluster connectivity verified"

  build:
    commands:
      - echo "========== BUILD PHASE =========="
      - set -e

      - |
        build_and_push () {
          SERVICE=$1
          if [ -f "./$SERVICE/Dockerfile" ]; then
            echo "Building $SERVICE..."
            docker build -t $ECR_REPO:$SERVICE-$IMAGE_TAG ./$SERVICE
            docker tag $ECR_REPO:$SERVICE-$IMAGE_TAG $ECR_REPO:$SERVICE-latest
            docker push $ECR_REPO:$SERVICE-$IMAGE_TAG
            docker push $ECR_REPO:$SERVICE-latest
            echo "✓ $SERVICE built and pushed successfully"
          else
            echo "⚠ $SERVICE/Dockerfile not found, skipping..."
          fi
        }

      - build_and_push user-service
      - build_and_push task-service
      - build_and_push job-service
      - build_and_push import-service

  post_build:
    commands:
      - echo "========== DEPLOY PHASE =========="
      - set -e

      - echo "Replacing image tags in deployment files..."
      - find . -name "*deployment.yaml" -exec sed -i "s|<commit-hash>|$IMAGE_TAG|g" {} \;

      - echo "Applying Kubernetes manifests..."
      - kubectl apply -f ./user-service/ -n $NAMESPACE
      - kubectl apply -f ./task-service/ -n $NAMESPACE
      - kubectl apply -f ./job-service/ -n $NAMESPACE
      - kubectl apply -f ./import-service/ -n $NAMESPACE
      - kubectl apply -f k8s/ingress.yaml -n $NAMESPACE

      - echo "Waiting for rollouts..."
      - kubectl rollout status deployment/user-service -n $NAMESPACE
      - kubectl rollout status deployment/task-service -n $NAMESPACE
      - kubectl rollout status deployment/job-service -n $NAMESPACE
      - kubectl rollout status deployment/import-service -n $NAMESPACE

      - echo "✓ Deployment completed successfully"

artifacts:
  files: []
