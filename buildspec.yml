version: 0.2

env:
  variables:
    AWS_REGION: "ap-south-1"
    ECR_REPO: 964474461010.dkr.ecr.ap-south-1.amazonaws.com/microservices-backend
    EKS_CLUSTER_NAME: "microservices-backend"
    NAMESPACE: "dev"

phases:
  install:
    commands:
      - echo "Installing kubectl"
      - curl -Lo kubectl https://github.com/kubernetes/kubernetes/releases/download/v1.32.9/kubectl-linux-amd64
      - chmod +x kubectl
      - mv kubectl /usr/local/bin/
      - kubectl version --client

  pre_build:
    commands:
      - echo "Logging in to Docker Hub..."
      - echo "$DOCKERHUB_PASSWORD" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin

      - echo "Logging in to Amazon ECR..."
      - aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $ECR_REPO

      - echo "Setting image variables..."
      - REPOSITORY_URI=$ECR_REPO
      - COMMIT_HASH=$(echo $CODEBUILD_RESOLVED_SOURCE_VERSION | cut -c 1-7)
      - IMAGE_TAG=${COMMIT_HASH:=latest}

      - echo "Checking CodeBuild IAM identity..."
      - aws sts get-caller-identity

      - echo "Updating kubeconfig for EKS cluster..."
      - aws eks update-kubeconfig --region $AWS_REGION --name $EKS_CLUSTER_NAME

      - cat ~/.kube/config | grep -A 5 "clusters:"
      - cat ~/.kube/config | grep -A 10 "users:"
      - export AWS_EKS_TOKEN_API_VERSION=client.authentication.k8s.io/v1
      - kubectl config current-context
      - kubectl config view
      - echo "Waiting for authentication to propagate..."
      - sleep 15
      - echo "Testing cluster access..."
      - kubectl get nodes

  build:
    commands:
      - echo "=== Building and pushing microservices images to ECR ==="

      # User Service
      - |
        if [ -f "./user-service/Dockerfile" ]; then
          echo "Building user-service..."
          docker build -t $ECR_REPO:user-service-$IMAGE_TAG ./user-service
          docker push $ECR_REPO:user-service-$IMAGE_TAG
          echo "✓ user-service built and pushed successfully"
        else
          echo "⚠ Warning: user-service/Dockerfile not found, skipping..."
        fi

      # Task Service
      - |
        if [ -f "./task-service/Dockerfile" ]; then
          echo "Building task-service..."
          docker build -t $ECR_REPO:task-service-$IMAGE_TAG ./task-service
          docker push $ECR_REPO:task-service-$IMAGE_TAG
          echo "✓ task-service built and pushed successfully"
        else
          echo "⚠ Warning: task-service/Dockerfile not found, skipping..."
        fi

      # Job Service
      - |
        if [ -f "./job-service/Dockerfile" ]; then
          echo "Building job-service..."
          docker build -t $ECR_REPO:job-service-$IMAGE_TAG ./job-service
          docker push $ECR_REPO:job-service-$IMAGE_TAG
          echo "✓ job-service built and pushed successfully"
        else
          echo "⚠ Warning: job-service/Dockerfile not found, skipping..."
        fi

      # Import Service
      - |
        if [ -f "./import-service/Dockerfile" ]; then
          echo "Building import-service..."
          docker build -t $ECR_REPO:import-service-$IMAGE_TAG ./import-service
          docker push $ECR_REPO:import-service-$IMAGE_TAG
          echo "✓ import-service built and pushed successfully"
        else
          echo "⚠ Warning: import-service/Dockerfile not found, skipping..."
        fi

  post_build:
    commands:
      - echo "Deploying to EKS cluster..."
      - kubectl set image deployment/import-service import-service=$ECR_REPO:import-service-$IMAGE_TAG -n $NAMESPACE
      - kubectl set image deployment/job-service job-service=$ECR_REPO:job-service-$IMAGE_TAG -n $NAMESPACE
      - kubectl set image deployment/task-service task-service=$ECR_REPO:task-service-$IMAGE_TAG -n $NAMESPACE
      - kubectl set image deployment/user-service user-service=$ECR_REPO:user-service-$IMAGE_TAG -n $NAMESPACE
      - kubectl rollout status deployment/import-service -n $NAMESPACE
      - kubectl rollout status deployment/job-service -n $NAMESPACE
      - kubectl rollout status deployment/task-service -n $NAMESPACE
      - kubectl rollout status deployment/user-service -n $NAMESPACE
      - kubectl apply -f user-service/
      - kubectl apply -f task-service/
      - kubectl apply -f job-service/
      - kubectl apply -f import-service/
      - echo "Applying ingress and configs/secrets..."
      - kubectl apply -f k8s/ingress.yaml

artifacts:
  files: []
